name: Tests

# Unit and integration tests on GitHub-hosted runners only. Never the Pi or
# the central machine's self-hosted runners. No secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' webrtcvad-wheels vosk
      - name: Run tests
        run: python -m pytest
