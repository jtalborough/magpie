<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="840" viewBox="0 0 1060 840" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1060" height="840" fill="#f4f5f7"/>

  <!-- ============ LEFT: PHONE / INTERFACE ============ -->
  <rect x="40" y="40" width="400" height="760" rx="30" fill="#ffffff" stroke="#343a40" stroke-width="2" filter="url(#shadow)"/>

  <text x="68" y="96" font-size="26" font-weight="700" fill="#212529">Searchable Storage</text>
  <text x="68" y="120" font-size="13" fill="#868e96">find anything in one line — no browsing</text>

  <!-- search bar -->
  <rect x="68" y="142" width="344" height="58" rx="14" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="90" y="178" font-size="18" fill="#343a40">mini screwdriver set</text>
  <circle cx="386" cy="171" r="17" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="378" y="177" font-size="16">🎤</text>

  <!-- ANSWER CARD -->
  <rect x="68" y="226" width="344" height="224" rx="18" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="92" y="244" font-size="12" font-weight="700" letter-spacing="1.5" fill="#1971c2">FOUND IT</text>
  <text x="90" y="300" font-size="44" font-weight="800" fill="#1864ab">Drawer 2</text>
  <circle cx="100" cy="332" r="6" fill="#1971c2"/>
  <text x="114" y="338" font-size="16" fill="#495057">top-left bin &#183; lit up now</text>
  <line x1="90" y1="358" x2="390" y2="358" stroke="#b8d8f0"/>
  <text x="90" y="386" font-size="17" font-weight="600" fill="#212529">iFixit Mini Precision Set</text>
  <text x="90" y="410" font-size="13" fill="#868e96">Qty 1  &#183;  Tools  &#183;  last seen Jun 2026</text>
  <text x="90" y="434" font-size="13" fill="#868e96">📷 photo on file</text>

  <!-- secondary actions (small, out of the way) -->
  <rect x="68" y="470" width="86" height="42" rx="21" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="98" y="496" font-size="14" fill="#495057">Move</text>
  <rect x="164" y="470" width="110" height="42" rx="21" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="186" y="496" font-size="14" fill="#495057">Put away</text>
  <rect x="284" y="470" width="110" height="42" rx="21" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="304" y="496" font-size="14" fill="#495057">Not here?</text>

  <!-- mini map -->
  <text x="68" y="556" font-size="12" font-weight="700" letter-spacing="1" fill="#adb5bd">WHERE IT LIGHTS UP</text>
  <rect x="120" y="572" width="240" height="46" rx="8" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="210" y="601" font-size="15" fill="#adb5bd">Drawer 1</text>

  <rect x="116" y="626" width="248" height="54" rx="9" fill="#4dabf7" opacity="0.45" filter="url(#glow)"/>
  <rect x="120" y="628" width="240" height="48" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/>
  <text x="196" y="658" font-size="16" font-weight="700" fill="#1864ab">🔦 Drawer 2</text>

  <rect x="120" y="690" width="240" height="46" rx="8" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="210" y="719" font-size="15" fill="#adb5bd">Drawer 3</text>

  <!-- ============ RIGHT: THE MODEL ============ -->
  <text x="540" y="92" font-size="24" font-weight="700" fill="#212529">Everything is a Location</text>
  <text x="540" y="118" font-size="13" fill="#868e96">lit or not &#183; structured or not &#183; movable</text>

  <!-- connectors (drawn first, behind nodes) -->
  <path d="M 600 196 L 600 244 L 632 244" fill="none" stroke="#adb5bd" stroke-width="2"/>
  <path d="M 660 290 L 660 330 L 692 330" fill="none" stroke="#1971c2" stroke-width="2"/>
  <path d="M 660 290 L 660 392 L 692 392" fill="none" stroke="#adb5bd" stroke-width="2"/>
  <path d="M 660 506 L 660 548 L 692 548" fill="none" stroke="#adb5bd" stroke-width="2"/>

  <!-- node: Wall Cabinet (lit) -->
  <rect x="540" y="150" width="260" height="48" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="560" y="180" font-size="15" font-weight="600" fill="#1864ab">🗄  Wall Cabinet &#183; lit grid</text>

  <!-- node: Drawer 2 (lit) -->
  <rect x="600" y="244" width="260" height="48" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="620" y="274" font-size="15" font-weight="600" fill="#1864ab">🗃  Drawer 2 &#183; lit grid</text>

  <!-- node: bin (lit, the item) -->
  <rect x="636" y="330" width="280" height="46" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="654" y="358" font-size="14" font-weight="700" fill="#1864ab">▫ Bin C3·R5 — mini screwdrivers</text>

  <!-- node: pouch (no light) -->
  <rect x="636" y="392" width="280" height="46" rx="12" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="654" y="420" font-size="14" fill="#495057">👝 Blue Pouch &#183; words guide you</text>

  <!-- node: Shelf A (no light) -->
  <rect x="600" y="460" width="260" height="48" rx="12" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="620" y="490" font-size="15" font-weight="600" fill="#495057">🗄  Shelf A &#183; no light</text>

  <!-- node: rugged box (no light) -->
  <rect x="636" y="548" width="280" height="46" rx="12" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="654" y="576" font-size="14" fill="#495057">📦 Rugged Box 3 &#183; words guide you</text>

  <!-- legend -->
  <rect x="540" y="638" width="376" height="120" rx="14" fill="#ffffff" stroke="#e9ecef"/>
  <text x="560" y="668" font-size="13" font-weight="700" letter-spacing="1" fill="#adb5bd">HOW GUIDANCE DEGRADES</text>
  <circle cx="568" cy="692" r="7" fill="#1971c2"/>
  <text x="584" y="697" font-size="14" fill="#343a40">Has a light → the spot glows.</text>
  <circle cx="568" cy="722" r="7" fill="#adb5bd"/>
  <text x="584" y="727" font-size="14" fill="#343a40">No light → nearest lit parent glows + words finish it.</text>
  <text x="584" y="749" font-size="12.5" fill="#868e96">e.g. &#8220;Drawer 2 lights — your set is in the blue pouch.&#8221;</text>
</svg>
